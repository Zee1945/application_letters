server {
    listen 80;
    server_name app.local;
    root /var/www/html/public;
    index index.php index.html;

    # Docker embedded DNS. Diperlukan agar nginx bisa me-resolve nama service
    # secara dinamis (lihat catatan di bawah). valid=10s = TTL cache DNS.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Batas ukuran upload — harus >= upload_max_filesize/post_max_size PHP (80M).
    client_max_body_size 80M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ \.php$ {
        # Pakai VARIABEL untuk upstream agar nginx me-resolve DNS `app` PER REQUEST
        # (via resolver di atas), bukan sekali saat start. Ini mencegah 502
        # "No route to host" ketika container `app` di-recreate & dapat IP baru.
        set $upstream app:9000;
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        access_log /var/log/nginx/php_access.log;
    }
    location ~ /\.ht {
        deny all;
    }
}

